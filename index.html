<style>
  :root{ --bg:#fbf6f1; --ink:#3b2a2a; --muted:#8a7470; --rose:#c0626e; --rose-soft:#f3dcdc; --gold:#b8935a; --card:#ffffff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;transition:background 0.4s, color 0.4s;}
  h1,h2,h3{font-family:'Playfair Display',serif;font-weight:500}

  /* ===== HERO ===== */
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px;position:relative;overflow:hidden;z-index:1;
    background:radial-gradient(circle at 15% 20%,#f9e4e4 0,transparent 45%),radial-gradient(circle at 85% 85%,#f6ead6 0,transparent 45%)}
  .hero .tag{letter-spacing:.35em;text-transform:uppercase;font-size:.75rem;color:var(--gold)}
  .hero h1{font-size:clamp(2.6rem,9vw,5.5rem);margin:14px 0 6px;color:var(--ink)}
  .hero h1 span{color:var(--rose);font-style:italic;font-weight:500}
  .hero .date{color:var(--muted);font-size:1.05rem}
  .counter{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:36px 0 14px}
  .counter div{background:var(--card);border-radius:16px;padding:16px 18px;min-width:84px;box-shadow:0 6px 24px rgba(192,98,110,.12);transition:background 0.4s;}
  .counter b{display:block;font-family:'Playfair Display',serif;font-size:2rem;color:var(--rose);font-weight:700}
  .counter small{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}
  .days{color:var(--muted);font-size:.95rem}
  .days strong{color:var(--rose)}
  .scroll{margin-top:36px;color:var(--gold);text-decoration:none;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase}
  .heart{position:absolute;color:var(--rose);opacity:.25;animation:float linear infinite;user-select:none;z-index:-1}
  @keyframes float{from{transform:translateY(105vh)}to{transform:translateY(-15vh)}}

  /* --- nền hero: ảnh thật mờ dần, chuyển cảnh chậm --- */
  .hero-bg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0;transform:scale(1);transition:opacity 2s ease-in-out,transform 8s linear}
  .hero-bg.on{opacity:.2;transform:scale(1.08)}
  /* --- hiện dần khi mở trang --- */
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes bob{50%{transform:translateY(6px)}}
  .scroll span{display:inline-block;animation:bob 2s infinite}
  /* --- tim nổ khi chạm --- */
  .pop{position:fixed;pointer-events:none;z-index:900;color:var(--rose);animation:pop 1.4s ease-out forwards}
  @keyframes pop{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2)}}
  /* --- hiện dần khi cuộn tới --- */
  .io .reveal{opacity:0;translate:0 36px;transition:opacity .8s ease,translate .8s cubic-bezier(.2,.7,.2,1)}
  .io .reveal.in{opacity:1;translate:0 0}
  /* --- gợi ý bật nhạc --- */
  #musicHint{position:fixed;right:18px;bottom:136px;z-index:100;background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;font-size:.85rem;box-shadow:0 6px 20px rgba(59,42,42,.18);opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .4s,transform .4s}
  #musicHint.show{opacity:1;transform:none}
  /* --- thanh chọn năm --- */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px}
  .chips a{padding:6px 14px;border-radius:999px;background:var(--rose-soft);color:var(--rose);text-decoration:none;font-size:.88rem;transition:background .2s,color .2s}
  .chips a:hover{background:var(--rose);color:#fff}
  /* --- thông tin từng năm --- */
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .loc{display:inline-block;background:var(--gold);color:#fff;border-radius:999px;padding:2px 14px;font-size:.8rem}
  .note{color:var(--muted);max-width:640px;margin:-4px 0 14px}
  .letter{max-width:640px;margin-bottom:22px;background:rgba(255,255,255,.7);border-radius:12px;padding:10px 16px;transition:background 0.4s;}
  .letter summary{cursor:pointer;color:var(--rose);font-weight:500;user-select:none}
  .letter .content{margin-top:10px;padding-top:10px;border-top:1px dashed #e3c9c9;font-style:italic;white-space:pre-wrap}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
  .year::before{animation:beat 2.2s infinite}

  #notice{display:none;max-width:700px;margin:0 auto;padding:12px 16px;background:#fff3cd;color:#664d03;border-radius:10px;font-size:.9rem;text-align:center}

  /* ===== TIMELINE ===== */
  main{max-width:1100px;margin:0 auto;padding:40px 18px 80px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:30px}
  .toolbar h2{font-size:1.8rem}
  .year{position:relative;padding-left:34px;margin-bottom:64px;border-left:2px dashed #e3c9c9}
  .year::before{content:"♥";position:absolute;left:-12px;top:0;width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--rose);font-size:18px;line-height:22px;text-align:center;transition:background 0.4s;}
  .badge{display:inline-block;background:var(--rose);color:#fff;border-radius:999px;padding:2px 14px;font-size:.8rem;letter-spacing:.08em}
  .year h3{font-size:2rem;margin:8px 0 14px}
  .grid{columns:3 240px;column-gap:20px}
  .ph{break-inside:avoid;margin-bottom:20px;background:var(--card);padding:12px 12px 60px;box-shadow:0 4px 16px rgba(59,42,42,.08);position:relative;border-radius:4px;cursor:zoom-in;
    transition:transform .25s,box-shadow .25s,rotate .25s,opacity .8s ease calc(var(--d,0)*70ms),translate .8s cubic-bezier(.2,.7,.2,1) calc(var(--d,0)*70ms), background 0.4s}
  .ph:nth-child(odd){rotate:-2deg}
  .ph:nth-child(even){rotate:2deg}
  .ph:hover,.ph:focus-visible{rotate:0deg;transform:translateY(-8px) scale(1.03);box-shadow:0 14px 34px rgba(59,42,42,.18);outline:none;z-index:2}
  .ph img{width:100%;display:block;border-radius:2px}
  .ph .cap{position:absolute;inset:auto 0 0 0;height:60px;display:flex;align-items:center;justify-content:center;padding:0 10px;text-align:center;font-family:'Caveat','Be Vietnam Pro',cursive;font-size:1.4rem;line-height:1.2}
  .placeholder{aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;background:linear-gradient(135deg,#f6e1e1,#f4ead7);color:var(--muted);font-size:.85rem}
  .placeholder span{font-size:2rem}
  .empty{padding:30px;border:2px dashed #e3c9c9;border-radius:14px;color:var(--muted);text-align:center}
  footer{text-align:center;color:var(--muted);padding:30px 0 50px;font-size:.9rem}
  #secret{cursor:default;padding:6px;user-select:none}

  /* ===== NÚT NỔI ===== */
  .music-btn{position:fixed;bottom:20px;right:20px;z-index:100;width:48px;height:48px;border-radius:50%;background:var(--rose);color:#fff;border:none;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 12px rgba(192,98,110,.4)}
  .music-btn.playing{animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,98,110,.7)}70%{box-shadow:0 0 0 15px rgba(192,98,110,0)}100%{box-shadow:0 0 0 0 rgba(192,98,110,0)}}
  
  .theme-btn { position: fixed; bottom: 78px; right: 20px; z-index: 100; width: 48px; height: 48px; border-radius: 50%; background: var(--card); color: var(--ink); border: none; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.15); transition: transform 0.3s, background 0.4s, color 0.4s; display:flex; align-items:center; justify-content:center; }
  .theme-btn:hover { transform: scale(1.1); }

  /* ===== ĐẾM NGƯỢC + CHẠM ĐỂ NỔ TIM ===== */
  .next{color:var(--muted);font-size:.95rem;margin-top:6px}
  .next strong{color:var(--rose)}
  .note{white-space:pre-wrap}
  #names,.counter{cursor:pointer}

  /* ===== MÀN HÌNH MỞ THI
