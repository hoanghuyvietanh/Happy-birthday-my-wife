<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Chúc mừng sinh nhật em yêu" />
    <meta name="theme-color" content="#ffe6f0" />
    
    <meta property="og:title" content="Happy Birthday Vợ Yêu ❤️" />
    <meta property="og:description" content="Hôm nay là ngày của em. Anh gói ghém vài điều nhỏ xíu ở đây, mong em cười thật nhiều." />
    <meta property="og:image" content="./img/avatar.jpg" />

    <link rel="icon" type="image/png" href="./img/CILKGax.png" />
    <title>Happy Birthday My Wife</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" />
    
    <!-- Link CSS gốc -->
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="stylesheet" href="./css/default.css" />
    <link rel="stylesheet" href="./css/gallery.css" />

    <style>
        /* =========================================
           SỬA LỖI LỆCH GIAO DIỆN (CĂN GIỮA TUYỆT ĐỐI)
           ========================================= */
        
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background: linear-gradient(135deg, #fff0f5 0%, #ffe6f0 100%);
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        
        .page-section { 
            display: none; 
            position: absolute;
            top: 0; left: 0; 
            width: 100vw !important; 
            max-width: 100% !important;
            height: 100vh;
            box-sizing: border-box !important;
            animation: fadeIn 0.4s ease-in-out;
            background: transparent !important; 
        }
        
        /* -----------------------------------------
           SỬA LỖI TAB LỜI CHÚC (AVATAR + NÚT BẤM)
           ----------------------------------------- */
        .page-section.active#home {
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important; /* Đẩy từ trên xuống thay vì ép giữa */
            align-items: center !important;
            text-align: center !important;
            overflow-y: auto !important; /* CHO PHÉP CUỘN để không bị mất nút bấm */
            overflow-x: hidden !important;
            padding-top: 100px !important; /* Dịch xuống khỏi menu */
            padding-bottom: 120px !important; /* Chừa chỗ trống bên dưới */
        }

        /* Hủy bỏ mọi margin/padding lệch từ CSS cũ */
        #home > * {
            margin-left: auto !important;
            margin-right: auto !important;
            transform: none !important;
            left: auto !important;
            right: auto !important;
        }

        /* Chỉnh lại Avatar và Vòng tròn hồng để không bị lệch */
        #home .avatar { 
            position: relative !important;
            display: flex !important; 
            justify-content: center !important;
            align-items: center !important;
            margin: 0 auto 20px !important; 
            width: 180px !important; 
            height: 180px !important;
        }
        #home .avatar img { 
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: 50% !important; 
            box-shadow: 0 10px 20px rgba(255, 77, 133, 0.3) !important;
            position: relative !important;
            z-index: 2 !important;
        }
        /* Ép vòng tròn trang trí của file home.css vào chính giữa */
        #home .avatar::before, #home .avatar::after {
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) !important;
        }

        /* -----------------------------------------
           CÁC TAB CÒN LẠI 
           ----------------------------------------- */
        .page-section.active#timeline {
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            overflow: hidden;
        }
        #wrap { position: relative; margin: 0 auto; width: 1100px; height: 680px; }

        .page-section.active#gallery, 
        .page-section.active#memory-box {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            padding-top: 100px !important;
            padding-bottom: 120px !important;
        }
        .ghead { text-align: center; width: 100%; margin-bottom: 30px; }
        
        .masonry {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)) !important;
            gap: 20px !important;
            width: 90% !important;
            max-width: 1200px !important;
            margin: 0 auto !important;
        }
        .masonry .shot { margin: 0 !important; width: 100% !important; }
        .masonry .shot img { 
            width: 100% !important; height: auto !important; 
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }
        .masonry .shot img:hover { transform: translateY(-5px); }

        .upload-area {
            width: 90%; max-width: 500px; margin: 0 auto 40px; padding: 25px;
            border: 2px dashed #ff85a2; border-radius: 15px;
            background: rgba(255, 255, 255, 0.7); text-align: center;
            box-shadow: 0 8px 25px rgba(255, 133, 162, 0.15);
        }
        .upload-area input {
            width: 100%; box-sizing: border-box;
            padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ffb3c6;
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        .upload-area input:focus { outline: none; border-color: #ff4d85; box-shadow: 0 0 5px rgba(255,77,133,0.3); }
        .upload-btn {
            background: #ff4d85; color: white; border: none; padding: 12px 25px;
            border-radius: 25px; cursor: pointer; font-weight: 600; margin-top: 15px;
            transition: all 0.3s;
        }
        .upload-btn:hover { background: #d6336c; transform: scale(1.05); }
        
        .mem-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); margin-bottom: 20px; text-align: center; }
        .mem-card img { width: 100%; border-radius: 10px; }
        .mem-card h3 { font-family: 'Dancing Script', cursive; font-size: 32px; color: #ff4d85; margin: 15px 0 5px; }
        .mem-card p { font-size: 15px; color: #555; font-style: italic; }
        .del-btn { background: #fff0f5; border: 1px solid #ffb3c6; padding: 8px 15px; border-radius: 20px; color: #ff4d85; cursor: pointer; font-size: 13px; margin-top: 15px;}
        .del-btn:hover { background: #ff4d85; color: #fff; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .menu a.active { color: #ff4d85; font-weight: bold; border-bottom: 2px solid #ff4d85; }
        
        /* Căn giữa nút random */
        .random-note-box { margin: 20px auto 0 !important; text-align: center !important; }
        #random-note { margin-top: 15px; font-style: italic; color: #d6336c; font-weight: 600; min-height: 24px; }
        
        #music-toggle {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            background: #ff4d85; color: white; border: none; border-radius: 50%;
            width: 55px; height: 55px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 77, 133, 0.4);
            font-size: 26px; display: flex; align-items: center; justify-content: center;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 4s linear infinite; }
    </style>
</head>
